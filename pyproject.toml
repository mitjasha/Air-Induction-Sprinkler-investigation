[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sprinkler1d"
version = "0.2.1"
description = "Reduced-order model of air induction, film flow and rainfall in a sprinkler"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Dmitry Shakhrai"}]
dependencies = ["numpy>=2.0,<3", "scipy>=1.14,<2", "matplotlib>=3.9,<4", "pint>=0.24,<1"]
keywords = ["CFD", "multiphysics", "reduced-order-model", "sprinkler", "parameter-estimation"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1.2,<2", "ruff>=0.11,<1"]

[project.scripts]
sprinkler1d = "sprinkler1d.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
